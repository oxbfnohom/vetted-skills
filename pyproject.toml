[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vsk"
version = "0.1.0"
description = "Search an agent-skill registry and see the security verdict before you install."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "oxbfnohom" }]
keywords = ["agent-skills", "security", "scanner", "supply-chain", "claude", "hermes", "vetted"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/oxbfnohom/vetted-skills"
Issues = "https://github.com/oxbfnohom/vetted-skills/issues"

[project.scripts]
vsk = "vsk.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
